name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  bun-version-consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Check Bun version consistency
        run: |
          PACKAGE_MANAGER=$(jq -r '.packageManager // empty' package.json | sed 's/^bun@//')
          RENOVATE_CONSTRAINT=$(sed -n \
            '/"constraints"[[:space:]]*:/,/^[[:space:]]*}/ s/.*"bun"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' \
            .github/renovate.jsonc)

          if [ -z "$PACKAGE_MANAGER" ]; then
            echo "::error::Missing package.json#packageManager"
            exit 1
          fi

          if [ -z "$RENOVATE_CONSTRAINT" ]; then
            echo "::error::Missing renovate.jsonc#constraints.bun"
            exit 1
          fi

          if [ "$PACKAGE_MANAGER" != "$RENOVATE_CONSTRAINT" ]; then
            echo "::error::Bun version mismatch — package.json#packageManager=$PACKAGE_MANAGER renovate.jsonc#constraints.bun=$RENOVATE_CONSTRAINT"
            exit 1
          fi

          echo "Bun version consistent: $PACKAGE_MANAGER"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: bun install --frozen-lockfile
      - run: bun run typegen
      - run: bun run lint

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: bun install --frozen-lockfile
      - run: bun run format

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: bun install --frozen-lockfile
      - run: bun run typegen
      - run: bun run build
