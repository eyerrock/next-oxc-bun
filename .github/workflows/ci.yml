name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  bun-version-consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Check .bun-version, package.json, and renovate.json agree on Bun version
        run: |
          BUN_VERSION_FILE=$(tr -d '[:space:]' < .bun-version)
          PACKAGE_MANAGER=$(jq -r '.packageManager' package.json | sed 's/^bun@//')
          RENOVATE_CONSTRAINT=$(grep -v '^[[:space:]]*//' .github/renovate.json | jq -r '.constraints.bun')

          if [ "$BUN_VERSION_FILE" != "$PACKAGE_MANAGER" ] || [ "$BUN_VERSION_FILE" != "$RENOVATE_CONSTRAINT" ]; then
            echo "::error::Bun version mismatch — .bun-version=$BUN_VERSION_FILE package.json#packageManager=$PACKAGE_MANAGER renovate.json#constraints.bun=$RENOVATE_CONSTRAINT"
            exit 1
          fi

          echo "Bun version consistent across all three sources: $BUN_VERSION_FILE"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run typegen
      - run: bun run lint

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run format

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run typecheck

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run typegen
      - run: bun run build
